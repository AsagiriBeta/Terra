name: Build and Release

on:
  push:
    branches:
      - master

concurrency:
  group: bukkit-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Test and build Bukkit plugin
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :common:implementation:base:test :platforms:bukkit:shadowJar

      - name: Locate shaded JAR
        id: jar
        run: |
          JAR=$(ls platforms/bukkit/build/libs/*-shaded.jar | head -n 1)
          echo "path=$JAR" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$JAR")" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Terra-bukkit
          path: ${{ steps.jar.outputs.path }}
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="bukkit-${{ github.run_number }}"
          NOTES="$(git log -1 --pretty=%B | head -c 4000)"
          gh release create "$TAG" "${{ steps.jar.outputs.path }}" \
            --title "Terra Bukkit ${{ github.run_number }}" \
            --notes "$NOTES" \
            --latest
